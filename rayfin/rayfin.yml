id: atlas-dev
name: ATLAS-DEV
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://sure-heron-7bbbf23a44-northcentralus.webapp.fabricapps.net
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: true
    path: "packages/functions"
    buildCommand: "npm run build"
    auth:
      type: "application"
connectors:
  - name: atlas_sql_db
    type: fabric-sqldatabase
    config:
      workspaceId: 918924c8-a56a-41a9-b1fe-f6bfcd07c3c5
      itemId: a832d11c-c075-46a5-95c5-8473cff8bf44
    auth:
      type: application
    operations:
      - name: read
      - name: create
      - name: update
      - name: delete
